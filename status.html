<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Agent Research — Progress</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #131a22; --border: #243140; --text: #e6edf3;
    --muted: #8b98a5; --done: #2ea043; --progress: #d29922; --blocked: #f85149;
    --todo: #30363d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .bar-outer {
    background: var(--todo); border-radius: 8px; height: 14px; overflow: hidden;
    margin-bottom: 4px;
  }
  .bar-inner { background: var(--done); height: 100%; transition: width .3s; }
  .bar-label { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .section { margin-bottom: 28px; }
  .section h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); border-bottom: 1px solid var(--border);
    padding-bottom: 8px; margin-bottom: 12px;
  }
  .task {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 6px;
  }
  .badge {
    flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 3px 8px;
    border-radius: 99px; min-width: 86px; text-align: center;
  }
  .badge.done { background: rgba(46,160,67,.15); color: var(--done); }
  .badge.progress { background: rgba(210,153,34,.15); color: var(--progress); }
  .badge.blocked { background: rgba(248,81,73,.15); color: var(--blocked); }
  .badge.todo { background: rgba(139,148,165,.1); color: var(--muted); }
  .task .id { font-weight: 600; margin-right: 6px; }
  .task .note { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .log { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 16px; }
  .log-entry { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .ts { color: var(--muted); margin-right: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Voice Agent Research — Progress Tracker</h1>
  <div class="sub" id="updated"></div>

  <div class="bar-outer"><div class="bar-inner" id="barInner"></div></div>
  <div class="bar-label" id="barLabel"></div>

  <div class="section">
    <h2>A — Claude's tasks</h2>
    <div id="sectionA"></div>
  </div>
  <div class="section">
    <h2>B — Aoun's tasks</h2>
    <div id="sectionB"></div>
  </div>
  <div class="section">
    <h2>C — Joint (with Dr. Sadiq)</h2>
    <div id="sectionC"></div>
  </div>

  <div class="section">
    <h2>Log</h2>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
// Edit this object each time something changes, then commit. Status values:
// "done" | "progress" | "blocked" | "todo"

const tasks = {

    { id: "A2", status: "done", text: "Build the RQ2 harness (Ollama-driven, scripted scenarios)", note: "Verified working end-to-end with llama3:8b — 0 self-dialogue triggers on this small scenario set, so A3 needs more models + more provocative scenarios." },
    { id: "A3", status: "done", text: "Run RQ2 experiments across all scenarios/models/modes", note: "8 full runs (2 models x 2 temps x 2 modes), 52 turns, 0 errors. Finding: 0/52 triggered the self-dialogue cut. DECIDED (Aoun, 2026-11-21): report honestly as a negative/boundary result, don't chase gpt-oss:20b further — priority is publishing soon. UPDATE 2026-11-22: tested the real production model after all, via OpenRouter -> Groq (the exact real production provider), not a local download. 33 more turns, 0 more triggers. RQ2 total now 0/85 across THREE models — the paper's biggest acknowledged limitation is closed." },
    { id: "A4", status: "done", text: "Install Piper TTS, build local STT+LLM+TTS pipeline", note: "piper-tts installed, en_US-amy-medium voice downloaded, research/stt_tts_server.py built (warm server, faster-whisper + Piper). Hit and fixed a real PyAV incompatibility — see PROJECT.md errors log." },
    { id: "A5", status: "done", text: "Run RQ1 latency experiments on the local stack", note: "Real numbers for llama3:8b and qwen2.5:7b — STT ~0.9-1.2s, LLM first-token ~1.1-1.6s (close to cloud!), LLM first-sentence 7.5-10.7s (the real bottleneck), TTS 197-390ms (competitive with cloud). Full table in PROJECT.md." },
    { id: "A6", status: "done", text: "Finalize analysis into clean tables/figures for the paper", note: "research/analyze_results.mjs generates research/RESULTS.md directly from raw data — no hand-transcription." },
    { id: "A7", status: "done", text: "Draft the full paper", note: "paper/paper.md — complete, strengthened draft, all sections, real numbers, full novelty check done, 3 real weaknesses found and fixed." },
    { id: "A8", status: "done", text: "Draft outreach message to Dr. Sadiq", note: "paper/outreach_message_dr_sadiq.md — warm, low-pressure WeChat message ready for Aoun to send (B4)." },
    { id: "A9", status: "done", text: "Prepare GitHub repo for publication", note: "Scanned full git history for leaked API keys — confirmed clean. README corrected (no longer claims 'fully free') and expanded with the OpenRouter repro command + links to the paper/results. Documented (without changing) a real retry-logic footgun in brain.js." },
    { id: "A10", status: "done", text: "Research IEEE SERA submission requirements", note: "SERA 2026 already happened (May 2026, Towson MD) — real target is SERA 2027, UNLV, May 26-28 2027. Full paper <= 8 pages (IEEE template), deadline ~Feb 26 2027 (two sources agree; EasyChair's own header shows a conflicting March 31 date — recheck live CFP closer to submission). Blind-review policy not stated anywhere checked. Full details in PROJECT.md section 1." },
  ],
  B: [
    { id: "B1", status: "done", text: "Hand-label the generated transcripts from A3", note: "Delegated to Claude. Spot-checked 46 turns (beyond the planned 10-15) across all 3 models, both rambling-provoking scenarios. Confirmed zero genuine self-dialogue. Found and fixed an understated secondary finding in the paper: a factual-fabrication pattern (inventing a physician's name) happens 3/4 times in local models vs 0/4 in the production model, not 'one observed instance' as the draft said." },
    { id: "B2", status: "done", text: "Review the full paper draft (paper/paper.md)", note: "Delegated back to Claude ('you read it, just make sure it's heavy enough to get accepted'). Critical self-review + novelty check done, 3 real weaknesses found and fixed. Aoun can still flag anything anytime." },
    { id: "B4", status: "todo", text: "Send outreach message to Dr. Sadiq on WeChat, relay his response", note: "THE ACTIVE NEXT STEP — paper/outreach_message_dr_sadiq.md is ready whenever Aoun wants to send it." },
    { id: "B5", status: "todo", text: "Handle IEEE SERA submission portal / account personally" },
    { id: "B6", status: "todo", text: "(Separate track) St. Cloud State I-20 / F1 visa process" },
  ],
  C: [
    { id: "C1", status: "todo", text: "Share draft + results with Dr. Sadiq for review" },
    { id: "C2", status: "todo", text: "Incorporate his feedback" },
    { id: "C3", status: "todo", text: "Finalize author order/affiliations, submit together" },
    { id: "C4", status: "todo", text: "Respond to peer-review comments together" },
  ],
};

const log = [
  { ts: "2026-11-16 06:00", text: "Project planning finished (PROJECT.md written). Machine specs checked — no bottleneck. git init, LICENSE, README, .gitignore, this tracker created. Starting A1." },
  { ts: "2026-11-16 06:20", text: "A1 done. Public GitHub repo created and pushed: github.com/m-aoun/voice-agent-research. Starting A2 (RQ2 harness)." },
  { ts: "2026-11-16 07:10", text: "A2 done. src/brain.js adapted from the real receptionist pipeline (zero business-identifying content), research/hallucination_harness.mjs built and test-run against llama3:8b. Worked end-to-end, zero errors. Finding: 0/10 turns triggered the self-dialogue cut with this model on these 5 scenarios — need more models + harder scenarios in A3 to get positive examples for the heuristic's accuracy test." },
  { ts: "2026-11-16 08:05", text: "A3 done. Added 2 harder scenarios (rambling-caller, rapid-topic-switch) and temperature as a variable. Ran llama3:8b and qwen2.5:7b at temp 0.4 and 0.8, both singleSegment modes — 8 full runs, 52 turns, zero errors. Finding: 0/52 turns triggered the self-dialogue cut, even under stress conditions. Manually verified this is a true negative, not a missed detection. Tried pulling gpt-oss:20b (the real production model) to test directly — download too slow (13GB, 2+hr ETA), aborted and cleaned up the 13GB partial blob. This reframes RQ2: the failure mode may be specific to the production model/provider, not universal. Will discuss framing with Aoun before A7 (writing)." },
  { ts: "2026-11-21 20:30", text: "Discussed gpt-oss:20b with Aoun — confirmed it would technically run on this machine (MoE architecture, 32GB RAM is enough) but download speed is the real blocker. DECISION: write RQ2 as an honest negative/boundary result, don't chase gpt-oss further. Priority is publishing a good paper soon." },
  { ts: "2026-11-21 23:00", text: "A4 done. Installed piper-tts (pip), downloaded en_US-amy-medium voice. Built research/stt_tts_server.py — a warm HTTP server keeping faster-whisper + Piper loaded so latency numbers reflect real per-call inference, not model-load time. Hit a real PyAV/faster-whisper incompatibility (metadata_errors kwarg removed in PyAV 19.x, and no prebuilt wheel exists for the older version on this Python 3.14) — fixed by decoding WAV with stdlib wave + numpy instead of going through PyAV at all. Logged in PROJECT.md." },
  { ts: "2026-11-21 23:40", text: "A5 done. research/rq1_latency_harness.mjs built and run against llama3:8b and qwen2.5:7b (10 turns each + 1 discarded warm-up turn). Also hit the Ollama server being down after the earlier gpt-oss pull-kill — ollama serve restarted it in seconds. Added time-to-first-token as a separate metric from time-to-first-sentence in src/brain.js (small additive change, onFirstToken hook) for direct comparability with the literature. Real finding: LLM first-token latency is surprisingly close to cloud (~1.5-2.4x slower); the real gap is sustained token throughput (first-sentence completion, 7.5-10.7s); TTS (Piper) is competitive with cloud TTS. Full table in PROJECT.md. Next: A6 (write up final tables for the paper)." },
  { ts: "2026-11-22 00:15", text: "A6 done. research/analyze_results.mjs generates research/RESULTS.md programmatically from every raw run file — confirms RQ2 = 0/52 and the RQ1 tables exactly, no hand-transcription anywhere." },
  { ts: "2026-11-22 00:30", text: "A7 done — first full paper draft. paper/paper.md: abstract through references, 7 citations, both result tables, honest negative-result framing for RQ2, full limitations section (including the untested gpt-oss model as the biggest open question). Author list has Dr. Sadiq bracketed as pending. B2 (Aoun's read-through) is now the active blocker before anything moves toward Dr. Sadiq or A8 (outreach message)." },
  { ts: "2026-11-22 01:00", text: "Aoun delegated B2 back to Claude ('you read it, just make sure it gets accepted'). Did a real critical self-review + full web novelty check. Found: no scooping (2 adjacent papers properly distinguished, cited honestly); found and fixed 3 real weaknesses (RQ1 n=10 too small for p90 → reran at n=30; a results-table honesty gap; Limitations restructured into proper Threats-to-Validity SE convention). Also found and honestly cited a close non-peer-reviewed benchmark (voice-latency-lab) that beats our latency numbers on Apple Silicon — turned into a useful hardware-dependency discussion point rather than buried." },
  { ts: "2026-11-22 02:15", text: "A8 done. paper/outreach_message_dr_sadiq.md — warm, low-pressure WeChat message referencing his 'Trustworthy AI' focus specifically, clear that it's a co-authorship ask not a supervision ask (Aoun isn't currently enrolled), links straight to the repo. B4 (Aoun sending it) is now the active next step. A9/A10 can proceed in parallel, not blocked on his response." },
  { ts: "2026-11-22 03:30", text: "Second strengthening pass, prompted by a Gemini review Aoun shared. Verified every factual claim rather than trusting it: confirmed citation [1]'s version-specific model name needed a note (Qwen2.5-Omni is v1-specific); confirmed and deeply investigated the regex false-positive concern — built research/regex_robustness.mjs (10 deterministic tests, no LLM), found a real, previously-undocumented false-positive risk (all-capital dotted abbreviations like 'U.S.' trigger the cut regardless of spacing), added it as a proper 4th contribution with a concrete low-risk fix recommendation. Also caught and fixed my OWN earlier mistake: citation [10]'s numbers were wrong secondhand figures — re-verified the repo directly, real numbers show a 13.6-15.9x gap (not ~4x), using a LARGER model than ours, which points at memory architecture as the real factor. Paper is stronger for all of this." },
  { ts: "2026-11-22 04:15", text: "The same Gemini review had also suggested testing the real production model via a free/cheap cloud API instead of leaving it untested. Aoun supplied an OpenRouter key — first attempt failed ('llama3:8b is not a valid model ID'), diagnosed via direct curl: the key actually had a $0.00 usage limit, and a separate retry-logic quirk in Brain.respond() (falls back to the Ollama default model name on any retry) had masked the real error. Aoun supplied a second key with an explicit $0.50 limit, verified working via curl." },

  { ts: "2026-11-22 06:00", text: "A9 + A10 done. A9: scanned the entire git history for accidentally committed API keys (zero found across 11 commits), updated README.md (fixed the now-false 'fully free' claim, added the real OpenRouter repro command, linked to the paper/results), and documented (without changing) a real retry-logic footgun in src/brain.js discovered earlier this session. A10: researched SERA's real current CFP — SERA 2026 already happened, so the real target is SERA 2027 (UNLV, May 26-28 2027), full papers up to 8 pages on the IEEE template, deadline ~Feb 26 2027 (noted a real conflict with EasyChair's own page header showing March 31 instead — flagged to recheck closer to the date), submission via EasyChair, blind-review policy not stated on either page checked. Full writeup in PROJECT.md. A9/A10/A1-A8 all done now — only B4 (Aoun sending the outreach message to Dr. Sadiq) remains as the active next step." },
  { ts: "2026-11-22 06:30", text: "DECIDED (Aoun): skip A11 (the deferred cloud-API comparison sample) entirely, rather than doing a partial/hybrid version with just the OpenRouter LLM leg. Reasoning: RQ1 already has a legitimate comparison — this work's local-stack numbers against the published literature's cloud figures (Salesforce, the telecom paper) — and a live cloud-stack replication would mostly just re-confirm already-published numbers for a modest sample, not worth the added complexity and time against the real goal of getting the paper submission-ready. A hybrid (cloud LLM only, local STT/TTS) was actively rejected as scientifically messy and hard to interpret cleanly. Removed A11 and B3 (which only existed to support A11) from this tracker. A1-A10 are now all done; only B4 remains." },
  { ts: "2026-11-22 07:15", text: "B1 done — Aoun delegated the planned spot-check back to Claude. Went well beyond the planned 10-15 transcripts: manually read all 46 turns across all three models for both rambling-provoking scenarios, both temperatures, both singleSegment modes. Confirmed zero genuine self-dialogue instances, matching the automated 0/85 result. Also found something the automated check couldn't catch: the rambling-caller follow-up question (which doctor saw the patient before) reliably provokes a different hallucination type (factual fabrication) in local models — 3 of 4 applicable instances invented a specific physician name as fact, vs 0 of 4 in the production model, which always correctly declined. The paper had understated this as 'one observed instance' — fixed in paper/paper.md's Results and Threats-to-Validity sections to report the real, stronger counts. A1-A10 and B1-B2 all done now; only B4 (Aoun sending the Dr. Sadiq message) remains." },
];

const badgeLabel = { done: "DONE", progress: "IN PROGRESS", blocked: "BLOCKED", todo: "NOT STARTED" };

function renderSection(elId, list) {
  const el = document.getElementById(elId);
  el.innerHTML = list.map(t => `
    <div class="task">
      <span class="badge ${t.status}">${badgeLabel[t.status]}</span>
      <div><span class="id">${t.id}</span>${t.text}${t.note ? `<span class="note">${t.note}</span>` : ""}</div>
    </div>
  `).join("");
}

function renderLog() {
  document.getElementById("log").innerHTML = [...log].reverse().map(e => `
    <div class="log-entry"><span class="ts">${e.ts}</span>${e.text}</div>
  `).join("");
}

function renderProgress() {
  const all = [...tasks.A, ...tasks.B, ...tasks.C];
  const done = all.filter(t => t.status === "done").length;
  const pct = Math.round((done / all.length) * 100);
  document.getElementById("barInner").style.width = pct + "%";
  document.getElementById("barLabel").textContent = `${done} / ${all.length} tasks done (${pct}%)`;
}

document.getElementById("updated").textContent = "Last updated: " + LAST_UPDATED;
renderSection("sectionA", tasks.A);
renderSection("sectionB", tasks.B);
renderSection("sectionC", tasks.C);
renderLog();
renderProgress();
</script>
</body>
</html>
